# Spiegel des öffentlichen Repos nach OpenCoDE.
#
# Läuft NUR im öffentlichen Repo vivodepot/vivodepot — dieses Workflow-File entsteht im Kanon und wandert mit dem
# öffentlichen Zuschnitt hinaus; im privaten Repo verhindert die `if`-Bedingung jeden Lauf.
# Der Zugang (OPENCODE_TOKEN) ist ein Secret des öffentlichen Repos; er steht nie in dieser Datei.
name: Spiegel nach OpenCoDE

on:
  push:
    branches: [main]
    # Die Fassungs-Tags (v1.0.8xx) gehen mit; ohne diesen Auslöser erreichten sie OpenCoDE nie (28.09.2026).
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Ein Lauf nach dem anderen (01.10.2026): beim Release starteten der Lauf für main und der für das Tag gleichzeitig.
# Seit 02.10.2026 schiebt jeder Lauf nur, was ihn ausgelöst hat (tools/opencode-spiegel.js --plan); nacheinander bleibt es,
# damit das Release erst entsteht, wenn main angekommen ist. Kein Abbruch eines laufenden Spiegels.
concurrency:
  group: spiegel-nach-opencode
  cancel-in-progress: false

jobs:
  spiegeln:
    if: github.repository == 'vivodepot/vivodepot'
    # Das Token liegt als Secret in den Environments, nicht im Repo. Beide lassen nur main und Tags v* zu. Eine
    # Pflichtfreigabe gilt je Environment (GitHub-Doku „Deployments and environments“, Required reviewers), darum zwei:
    # ein Tag-Lauf (Release) wartet auf die Freigabe, ein main-Lauf nicht.
    environment: ${{ github.ref_type == 'tag' && 'opencode-spiegel-release' || 'opencode-spiegel' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # Die Tags vom Ursprung neu holen: bei einem Lauf für ein Tag legt actions/checkout es leichtgewichtig an, und
      # geschoben würde es ohne Signatur (v1.0.857, 02.10.2026). Mit --force ersetzt der Abruf das flache durch das echte.
      - name: Tags annotiert holen
        run: git fetch --force --no-tags origin '+refs/tags/*:refs/tags/*'
      - name: Token prüfen
        env:
          OPENCODE_TOKEN: ${{ secrets.OPENCODE_TOKEN }}
        run: node tools/opencode-spiegel.js --token-frist
      - name: Tag prüfen (annotiert, signiert ab v1.0.857)
        if: github.ref_type == 'tag'
        run: |
          curl --fail --silent --show-error --location -o "$RUNNER_TEMP/unterzeichnende" https://vivodepot.de/.well-known/vivodepot-allowed-signers
          node tools/opencode-spiegel.js --pruefen "$GITHUB_REF_NAME" --unterzeichnende "$RUNNER_TEMP/unterzeichnende"
      - name: Nach OpenCoDE schieben
        env:
          OPENCODE_TOKEN: ${{ secrets.OPENCODE_TOKEN }}
        run: |
          if [ -z "$OPENCODE_TOKEN" ]; then
            echo "::error::Das Secret OPENCODE_TOKEN fehlt im Repo vivodepot/vivodepot."
            exit 1
          fi
          ZIEL="https://oauth2:${OPENCODE_TOKEN}@gitlab.opencode.de/vivodepot/vivodepot.git"
          # Nur was diesen Lauf ausgelöst hat: bei einem Tag genau dieses Tag, bei main nur main. Ohne Überschreiben: weicht
          # OpenCoDE ab, schlägt der Push laut fehl, statt still zu überschreiben.
          node tools/opencode-spiegel.js --plan > "$RUNNER_TEMP/refspecs"
          while read -r REFSPEC; do git push "$ZIEL" "$REFSPEC"; done < "$RUNNER_TEMP/refspecs"
      - name: Release und Pakete auf OpenCoDE
        if: github.ref_type == 'tag'
        env:
          OPENCODE_TOKEN: ${{ secrets.OPENCODE_TOKEN }}
        run: node tools/opencode-spiegel.js --release "$GITHUB_REF_NAME" --quelle .
