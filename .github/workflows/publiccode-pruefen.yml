# publiccode.yml gegen den offiziellen Parser (publiccode-parser-go). openCoDE nimmt ein Projekt nur mit gültiger Datei
# ins Softwareverzeichnis auf. Die Fassung des Parsers ist festgelegt; ein Wechsel ist eine bewusste Änderung hier.
name: publiccode.yml prüfen

on:
  push:
    branches: [main, u2-kanon]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  parser:
    if: github.repository == 'vivodepot/vivodepot'   # nur öffentlich: im privaten Repo verbraucht kein Job GitHub-Minuten (Runner-Bau, 02.10.2026)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version: '1.25'
      - name: publiccode-parser (v5.4.3) installieren
        run: go install github.com/italia/publiccode-parser-go/v5/publiccode-parser@v5.4.3
      - name: publiccode.yml prüfen
        run: "$(go env GOPATH)/bin/publiccode-parser publiccode.yml"
