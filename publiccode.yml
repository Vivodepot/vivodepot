# Metadaten nach dem Standard publiccode.yml (https://yml.publiccode.tools/).
publiccodeYmlVersion: "0.4"   # nach der offiziellen openCoDE-Vorlage (28.09.2026); der Parser warnt nur, maßgeblich ist openCoDE

name: Vivodepot
# openCoDE verlangt das eigene Projekt; es spiegelt den Ursprung github.com/vivodepot/vivodepot.
url: "https://gitlab.opencode.de/vivodepot/vivodepot"
landingURL: "https://vivodepot.de"
# Das Logo im obersten Ordner, als PNG (der openCoDE-Server liefert SVG als text/plain aus, discourse.opencode.de/t/4670); Das Logo ist Kennzeichen der Vivodepot GmbH und nicht von der EUPL erfasst.
logo: logo.png

# softwareVersion und releaseDate setzt der Zuschnitt-Bau aus der zuletzt ausgelieferten Kern-Fassung, nie von Hand;
# die Einträge je Fassung stehen in CHANGELOG.md.
softwareVersion: "1.0.919"
releaseDate: "2026-10-06"

developmentStatus: stable
softwareType: standalone/web

platforms:
  - web

categories:
  - digital-citizenship
  - content-management
  - document-management

intendedAudience:
  # Bewusst nur "society": Vivodepot ist auf keinen Sektor und keine Altersgruppe zugeschnitten.
  scope:
    - society
  countries:
    - "de"



description:
  de:
    localisedName: Vivodepot
    genericName: "Persönliche Dokumentenablage"
    shortDescription: >
      Offline-Anwendung, mit der Menschen ihre Unterlagen aus allen Lebensbereichen selbst speichern und
      gezielt weitergeben.
    longDescription: >
      Vivodepot ist eine quelloffene Anwendung in einer einzigen HTML-Datei. Sie läuft im Browser, ohne
      Internetverbindung und ohne Konto. Die Unterlagen werden verschlüsselt in einer Datei gespeichert, die bei
      der Person selbst liegt, nicht auf einem Server.

      Müssen Unterlagen weitergegeben werden, etwa an eine Behörde, eine Praxis oder eine Bank, gibt die Person
      nur den passenden Auszug heraus, in gängigen Formaten wie HL7 FHIR, vCard, iCalendar oder PDF.
    features:
      - Läuft offline, ohne Konto und ohne Server
      - Verschlüsselung mit AES-256-GCM, Schlüssel aus dem Passwort der Nutzerin
      - Ausgabe als HL7 FHIR International Patient Summary
      - Weitere Ausgaben als vCard, Kalenderdatei und PDF
      - Getrennte Sub-Depots mit eigenem Passwort
      - Freigabe besonders geschützter Angaben durch die Nutzerin
      - Deutsch und Englisch
      - Quelloffen unter EUPL-1.2
    screenshots:
      # Aus der ausgelieferten Anwendung erzeugt (tools/screenshots-oeffentlich-erzeugen.js).
      - docs/screenshots/vivodepot-start.png
      - docs/screenshots/vivodepot-anlaesse.png
      - docs/screenshots/vivodepot-beispielansicht.png
  en:
    localisedName: Vivodepot
    genericName: "Personal document vault"
    shortDescription: >
      Offline application that lets people store their records from all areas of life themselves and pass on
      only what is needed.
    longDescription: >
      Vivodepot is an open-source application in a single HTML file. It runs in the browser without an
      internet connection and without an account. The records are stored encrypted in one file that stays with the person, not on a
      server.

      When records have to be passed on, for example to an authority, a doctor's practice or a bank, the person
      hands over only the relevant extract, in common formats such as HL7 FHIR, vCard, iCalendar or PDF.
    features:
      - Runs offline, with no account and no server
      - AES-256-GCM encryption, key derived from the user's password
      - Export as HL7 FHIR International Patient Summary
      - Further exports as vCard, calendar file and PDF
      - Separate sub-depots with their own password
      - Specially protected entries released by the person
      - German and English
      - Open source under EUPL-1.2
    screenshots:
      # Aus der ausgelieferten Anwendung erzeugt (tools/screenshots-oeffentlich-erzeugen.js).
      - docs/screenshots/vivodepot-start.png
      - docs/screenshots/vivodepot-anlaesse.png
      - docs/screenshots/vivodepot-beispielansicht.png

