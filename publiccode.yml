# softwareVersion und releaseDate setzt der Zuschnitt-Bau aus der zuletzt ausgelieferten Kern-Fassung, nie von Hand;
# die Einträge je Fassung stehen in CHANGELOG.md.
softwareVersion: "1.0.922"
releaseDate: "2026-10-08"

developmentStatus: stable
softwareType: standalone/web

platforms:
  - web

categories:
  - digital-citizenship
  - content-management
  - document-management

intendedAudience:
  # Bewusst nur "society": Vivodepot ist auf keinen Sektor und keine Altersgruppe zugeschnitten.
  scope:
    - society



description:
  de:
    localisedName: Vivodepot
    genericName: "Persönliche Dokumentenablage"
    shortDescription: >
      Quelloffene Anwendung, mit der Menschen ihre Unterlagen selbst halten und Auszüge gezielt weitergeben.
    longDescription: >
      Wer etwas beantragt, gibt dieselben Angaben immer wieder ab, und jede Stelle will sie in ihrer eigenen Form.
      Das heißt abtippen, oder die Unterlagen bleiben bei der Stelle, der man sie einmal gegeben hat.

      Vivodepot hält die Unterlagen bei der Person. Sie liegen in einer verschlüsselten Datei, die der Mensch selbst
      besitzt, für das eigene Leben. Die Anwendung ist eine einzelne HTML-Datei, läuft im Browser und braucht kein Konto.
      Wer eine Stelle bedienen will, gibt einen Auszug heraus, in einem offenen Format wie FHIR. Die Anwendung sendet
      keine Daten aus dem Depot an einen Server.

      Der Quelltext ist offen (EUPL-1.2).
    features:
      - Läuft ohne Konto
      - Verschlüsselung mit AES-256-GCM, Schlüssel aus dem Passwort der Nutzerin
      - Ausgabe als HL7 FHIR International Patient Summary
      - Weitere Ausgaben als vCard, Kalenderdatei und PDF
      - Getrennte Sub-Depots mit eigenem Passwort
      - Freigabe besonders geschützter Angaben durch die Nutzerin
      - Deutsch und Englisch
      - Quelloffen unter EUPL-1.2
    screenshots:
      # Aus der ausgelieferten Anwendung erzeugt (tools/screenshots-oeffentlich-erzeugen.js).
      - docs/screenshots/vivodepot-start.png
      - docs/screenshots/vivodepot-anlaesse.png
      - docs/screenshots/vivodepot-beispielansicht.png
  en:
    localisedName: Vivodepot
    genericName: "Personal document vault"
    shortDescription: >
      Open-source application that lets people keep their own records and hand out extracts where they are needed.
    longDescription: >
      Anyone who applies for something hands over the same details again and again, and every office wants them in its
      own format. That means retyping, or the records stay with whoever received them once.

      Vivodepot keeps the records with the person. They sit in one encrypted file the person holds, for one's own life.
      The application is a single HTML file, runs in the browser and needs no account. To serve a recipient, the person
      hands out an extract in an open format such as FHIR. The application sends no data from the depot to any server.

      The source code is open (EUPL-1.2).
    features:
      - No account needed
      - AES-256-GCM encryption, key derived from the user's password
      - Export as HL7 FHIR International Patient Summary
      - Further exports as vCard, calendar file and PDF
      - Separate sub-depots with their own password
      - Specially protected entries released by the person
      - German and English
      - Open source under EUPL-1.2
    screenshots:
      # Aus der ausgelieferten Anwendung erzeugt (tools/screenshots-oeffentlich-erzeugen.js).
      - docs/screenshots/vivodepot-start.png
      - docs/screenshots/vivodepot-anlaesse.png
      - docs/screenshots/vivodepot-beispielansicht.png

