<!doctype html><html><head><meta charset="utf-8"><style>
  :root { --grund: #f6f5f1; --karte-flaeche: #ffffff; --karte-rahmen: 1px solid #d8d2c4; --radius-karte: 13px;
    --schatten-karte: 0 4px 14px rgba(0,0,0,0.12); --fw-semibold: 600; --ls-label: 0.05em; --label-schreibung: uppercase; }
  body { margin: 0; background: var(--grund); font-family: sans-serif; }
  .karte { margin: 24px; padding: 16px; background: var(--karte-flaeche); border: var(--karte-rahmen); border-radius: var(--radius-karte);
    box-shadow: var(--schatten-karte); font-weight: var(--fw-semibold); letter-spacing: var(--ls-label); text-transform: var(--label-schreibung); }
</style></head><body><div class="karte">Erscheinungsbild</div></body></html>
