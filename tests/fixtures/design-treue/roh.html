<!doctype html>
<html><head><style>
  :root { --akzent: #4F6539; }
  .a { color: #123456; background: rgba(0,0,0,.5); font-size: 13px; border-radius: 6px; }
  .b { box-shadow: 0 1px 2px var(--akzent); }
  .c { box-shadow: 0 4px 14px rgba(0,0,0,0.12); border-left: 4px solid var(--akzent); }
  .d { text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; color: white; }
  .e { font-size: var(--fs-xs); }
</style></head>
<body>
<p style="color:#abcdef;font-weight:700">x</p>
<script>
  html += '<span style="font-size:12px;border-left:3px solid var(--akzent)">x</span>';
  el.style.color = '#ff0000';
</script>
</body></html>
