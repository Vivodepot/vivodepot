<section class="ampel-sektion" id="ampel-sektion" aria-label="Ihr Stand auf einen Blick"><h2 class="ampel-titel">Ihr Stand auf einen Blick</h2><p class="prueftermine-einfuehrung">Hier sehen Sie, welche Ihrer Dokumente bald ablaufen oder erneuert werden müssen. Vivodepot rechnet das aus Ihren eigenen Angaben, ohne Erinnerungen aus dem Internet. Legen Sie in einem Bereich ein Dokument mit Datum an, dann erscheint es hier.</p></section>
