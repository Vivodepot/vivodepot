<!doctype html>
<html lang="de" style="--vd-branding-primaer: #4F6539">
<head><meta charset="utf-8"><title>voll</title>
<style>
  body { margin: 0; background: #ffffff; color: #1c2a1e; font: 400 16px/1.5 sans-serif; }
  main { padding: 24px; }
  h1 { font-size: 32px; font-weight: 600; margin: 0 0 16px; }
  .knopf { background: #4F6539; color: #ffffff; border: 0; padding: 14px 20px; font: inherit; }
  .karte { background: #f3f1ea; border: 1px solid #c9c4b5; border-radius: 8px; padding: 12px; margin: 8px 0; }
  .pille { background: #e6ecdf; color: #4F6539; font-size: 13px; font-weight: 700; padding: 2px 8px; border-radius: 99px; }
  .hinweis { background: #fff4d6; color: #7a5a00; box-shadow: 0 1px 3px rgba(0,0,0,.2); border-radius: 4px; padding: 8px; font-size: 14px; }
  .leiste { background: #4F6539; color: #ffffff; padding: 8px; font-weight: 500; font-size: 18px; }
  .unterkarte { background: #ffffff; border: 1px solid #d8d3c4; padding: 8px; }
</style></head>
<body>
<div class="leiste">Kopfleiste</div>
<main>
  <h1>Volle Seite</h1>
  <div class="hinweis">Wichtig: ein Hinweis mit Schatten.</div>
  <div class="karte"><span class="pille">Neu</span> Karte eins
    <div class="unterkarte">Karte in der Karte</div></div>
  <div class="karte"><span class="pille">Offen</span> Karte zwei</div>
  <p>Ein Absatz Fließtext.</p>
  <button class="knopf">Weiter</button>
</main>
</body>
</html>
