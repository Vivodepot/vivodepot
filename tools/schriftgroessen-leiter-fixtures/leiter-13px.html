<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Fixture: 13 px außerhalb der Leiter</title>
<!-- Erfundene Fixture für das Schriftgrößen-Werkzeug (Rot-Beweis): ein fester Wert 13px, ein Token außerhalb der
     Leiter und eine im Skript gesetzte Größe müssen gefunden werden. -->
<style>
  :root { --fs-role-text: 0.9375rem; --fs-sm: 0.88rem; }
  body { margin: 16px; font-family: sans-serif; font-size: var(--fs-role-text); }
  .klein { font-size: 13px; }
  .alt { font-size: var(--fs-sm); }
</style>
</head>
<body>
  <p>Fließtext auf der Leiter.</p>
  <p class="klein">Ein Hinweis in 13 px.</p>
  <p class="alt">Ein Hinweis mit der alten Stufe.</p>
  <p id="skript">Im Skript gesetzt.</p>
  <script>document.getElementById('skript').style.fontSize = '12px';</script>
</body>
</html>
