<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Fixture: Leiter eingehalten</title>
<!-- Erfundene Fixture für das Schriftgrößen-Werkzeug: jede Schriftgröße zeigt auf ein Token der Größenleiter. -->
<style>
  :root {
    --fs-role-titel: 1.75rem; --fs-role-abschnitt: 1.25rem; --fs-role-gruppe: 1.0625rem; --fs-role-text: 0.9375rem;
    --fs-role-label: 0.875rem; --fs-role-wert: 0.9375rem; --fs-role-knopf: 0.9375rem; --fs-role-hilfe: 0.875rem;
  }
  @media (max-width: 767px) {
    :root { --fs-role-titel: 1.625rem; --fs-role-text: 1rem; --fs-role-label: 0.9375rem; --fs-role-wert: 1rem; --fs-role-knopf: 1rem; }
  }
  body { margin: 16px; font-family: sans-serif; font-size: var(--fs-role-text); }
  h1 { font-size: var(--fs-role-titel); font-weight: 650; }
  h2 { font-size: var(--fs-role-abschnitt); font-weight: 600; }
  label { font-size: var(--fs-role-label); font-weight: 500; display: block; }
  input { font-size: max(16px, var(--fs-role-wert)); }
  .hilfe { font-size: var(--fs-role-hilfe); }
  button { font-size: var(--fs-role-knopf); font-weight: 550; padding: 8px 16px; }
  button span { font-size: inherit; }
</style>
</head>
<body>
  <h1>Seitentitel</h1>
  <h2>Abschnitt</h2>
  <p>Ein Absatz Fließtext.</p>
  <label for="f">Beschriftung</label>
  <input id="f" value="Wert">
  <p class="hilfe">Ein Hinweis.</p>
  <button type="button"><span>Weiter</span></button>
</body>
</html>
