<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- frame-ancestors 'none' WIRKT NICHT (Nachtrag 18.09.2026, gemessen) — s. denselben Vermerk
       im Kern (vivodepot.html, an derselben CSP-Zeile) und tests/d43-etappe6-csp.test.js. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'">
  <!-- Rahmen-Schutz, WIRKLICH statt nur im wirkungslosen Meta-CSP oben — dasselbe Muster wie im
       Kern (vivodepot.html, an derselben Stelle), dort ausführlich begründet.
       `id="rahmen-schutz"` ist Pflicht: der Krypto-Block-Wächter findet den byte-gepinnten
       VdCrypto-Block über das ERSTE namenlose Skript-Element (reine Textsuche) — ein namenloses
       Element davor lenkt ihn fehl (s. Kommentar an derselben Stelle im Kern). -->
  <style id="rahmen-verbergen">body{display:none !important}</style>
  <script id="rahmen-schutz">
    if (window.self === window.top) {
      document.getElementById('rahmen-verbergen').remove();
    } else {
      try { window.top.location = window.self.location.href; } catch (e) { /* CSS-Verbergen bleibt bestehen */ }
    }
  </script>
  <title>Vivodepot · Lesen</title>
  <!-- `id="design-system"` (18.09.2026, dieselbe Kennung wie im Kern, s. dortiger Kommentar
       an derselben Stelle) — macht diesen Anker unabhängig von seiner Position im Dokument. -->
  <style id="design-system">
    /* ════════════════════════════════════════════════════════════════════════
       DIE FARBWELT DER LESE-APP FOLGT SEIT 17.08.2026 DEN KERN-TOKEN.
       ────────────────────────────────────────────────────────────────────────
       DER ANLASS: `--akzent` trug `#3d5a2a` — bitgenau den alten `--forest`-Wert,
       den die Entscheidung vom 05.08.2026 abgelöst hat. Im Kern kommt er seither
       NULL Mal vor. Hier hat er überlebt, weil er unter einem anderen NAMEN steht:
       jede Suche nach „forest" ging an ihm vorbei. Gefunden wurde er erst, als
       jemand nach dem WERT statt nach dem Namen suchte (Nachtkette 17.08., 10c).

       DIE NAMEN BLEIBEN. Die Lese-App ist eine eigene Anwendung mit eigener,
       schlanker Benennung (`--tinte` statt `--ink`); sie umzubenennen wäre ein
       zweiter Umbau ohne Gewinn. Angeglichen sind die WERTE.

       JEDER WERT IST GEMESSEN (`tools/lib/kontrast.js`), nicht übernommen —
       gegen BEIDE Hintergründe, auf die er trifft:
         --akzent       #4F6539  6.46 auf --flaeche · 6.25 auf --flaeche-warm
         --tinte        #1c2a1e  15.01 auf --flaeche
         --tinte-weich  #4a5e4f  6.99 auf --flaeche
         --leer         #637568  4.91 auf --flaeche · 4.75 auf --flaeche-warm

       WAS NICHT ANGEGLICHEN WURDE, UND WARUM — keine stille Auslassung:
       `--warn-bg`/`--warn-tinte` bleiben. Das Kern-Paar `--gold` auf `--gold-soft`
       misst **4.31** und liegt damit UNTER AA; das hiesige Paar misst 5.82. Der
       Kern nutzt Gold nicht als Fließtext auf Gold-Grund, die Lese-App tut es
       (`.klartext-warn`). Angleichen hiesse hier, Kontrast gegen Konsistenz zu
       tauschen.

       Zum abgelösten `--leer`-Wert: er war bis 13.08. `#9aa0a6` (2.64:1, 197
       axe-Knoten über 22 Sichten). Die damalige Wahl `#6b6f73` löste das; der
       Kern-Token `--ink3` löst es ebenso und ist zusätzlich derselbe Wert wie im
       Kern. Die Tönung wandert dabei von kühlem Grau nach Salbei-Grau — das war
       eine Eigenschaft der damaligen Lösung, nicht ihr Ziel.
       ════════════════════════════════════════════════════════════════════════ */
    :root {
      --akzent: #4F6539;          /* Kern --salbei-dunkel */
      --tinte: #1c2a1e;           /* Kern --ink */
      --tinte-weich: #4a5e4f;     /* Kern --ink2 */
      --linie: #d8d2c4;           /* Kern --line */
      --flaeche: #ffffff;         /* Kern --white */
      --flaeche-warm: #fdfbf7;    /* Kern --papier-bereich */
      --leer: #637568;            /* Kern --ink3 */
      --warn-bg: #fff4e5;         /* bewusst eigen, s. Kopf */
      --warn-tinte: #8a5300;      /* bewusst eigen, s. Kopf */
      /* A318 Zug 2: die Zertifikatsmarke braucht einen Ton fuer „traegt nicht".
         WOERTLICHER SPIEGEL DES KERNS (--error / --fehler-flaeche), nicht neu gewaehlt:
         #c0392b auf #fdecea misst 4.76:1 (AA). Ein eigener Rotton haette hier eine
         zweite Farbentscheidung ueber dieselbe Sache eroeffnet. */
      --fehler: #c0392b;          /* Kern --error */
      --fehler-flaeche: #fdecea;  /* Kern --fehler-flaeche */
      /* Nachtrag „Alles anpassbar" (17.08.2026): tokenisiert, NICHT umgefaerbt.
         Die Kamera-Flaeche ist schwarz, damit das Bild nicht auf hellem Grund
         flackert, bevor der Datenstrom steht — ein Modul darf das aendern. */
      --kamera-flaeche: #000;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--tinte);
      background: var(--flaeche-warm);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3 { font-weight: 600; color: var(--tinte); }
    .btn {
      font: inherit; cursor: pointer; border: none; border-radius: 8px;
      padding: 10px 18px; background: var(--akzent); color: #fff; font-weight: 600;
      transition: filter .15s;
    }
    .btn:hover { filter: brightness(1.08); }
    .btn-sek { background: transparent; color: var(--akzent); border: 1.5px solid var(--akzent); }

    /* ── Begrüßung ─────────────────────────────────────────── */
    .welcome-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 20px; }
    .welcome { max-width: 640px; width: 100%; background: var(--flaeche); border: 1px solid var(--linie); border-radius: 16px; padding: 40px 36px; box-shadow: 0 6px 28px rgba(31,35,40,.06); }
    .welcome h1 { margin: 0 0 18px; font-size: 1.7rem; }
    .welcome-text p { margin: 0 0 12px; color: var(--tinte-weich); }
    .wege { display: grid; gap: 12px; margin-top: 28px; }
    .weg-karte {
      display: flex; flex-direction: column; gap: 4px; text-align: left;
      background: var(--flaeche-warm); border: 1.5px solid var(--linie); border-radius: 12px;
      padding: 16px 18px; cursor: pointer; font: inherit; transition: border-color .15s, background .15s;
    }
    .weg-karte:hover { border-color: var(--akzent); background: #fff; }
    .weg-titel { font-weight: 600; color: var(--tinte); }
    .weg-hint { font-size: .9rem; color: var(--tinte-weich); }

    /* ── Sheet (Passwort / Einfügen / Hinweise) ────────────── */
    .sheet-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 20px; }
    .sheet { max-width: 480px; width: 100%; background: var(--flaeche); border: 1px solid var(--linie); border-radius: 16px; padding: 32px 30px; box-shadow: 0 6px 28px rgba(31,35,40,.06); }
    .sheet h2 { margin: 0 0 10px; font-size: 1.3rem; }
    .hint { color: var(--tinte-weich); margin: 0 0 18px; }
    .pw-feld, .qr-text {
      width: 100%; font: inherit; padding: 12px 14px; border: 1.5px solid var(--linie);
      border-radius: 10px; background: #fff; color: var(--tinte);
    }
    .pw-feld:focus, .qr-text:focus { outline: none; border-color: var(--akzent); }
    .qr-text { resize: vertical; min-height: 110px; }
    .qr-video { width: 100%; border-radius: 10px; background: var(--kamera-flaeche); display: block; }
    .pw-fehler { color: #a82a1c; font-size: .9rem; margin-top: 10px; }
    .qr-fortschritt { color: var(--akzent); font-size: .9rem; margin-top: 10px; font-weight: 600; }
    .sprach-luecke { background: var(--flaeche-warm); border-left: 3px solid var(--linie); border-radius: 6px; padding: 8px 12px; margin: 8px 0; font-size: 0.9rem; }
    .sprach-umschalter { display: flex; gap: 6px; justify-content: flex-end; margin-bottom: 14px; }
    .sprach-umschalter .btn[aria-pressed="true"] { font-weight: 700; text-decoration: underline; }
    .sheet-aktionen { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; flex-wrap: wrap; }

    /* ── App-Shell (Lese-Sicht) ────────────────────────────── */
    .app-shell { min-height: 100vh; display: flex; flex-direction: column; }
    /* Branding-CSS-Hook (13.09.2026, U2-ADR-400-Nachtrag) — dieselben Variablennamen wie im
       Kern (--vd-branding-topbar-primaer/-text), gesetzt von _markeFarbeAnwenden(). Fallback
       bleibt --akzent/#fff: ohne Branding-Modul, oder wenn keine Textfarbe die WCAG-AA-Schwelle
       erreicht, sieht diese Regel unverändert aus wie vor diesem Zug. */
    .topbar { display: flex; align-items: center; gap: 16px; padding: 12px 22px; background: var(--vd-branding-topbar-primaer, var(--akzent)); color: var(--vd-branding-topbar-text, #fff); }
    .tb-titel { font-weight: 700; letter-spacing: .2px; }
    .tb-mitte { flex: 1; text-align: center; opacity: .9; font-size: .95rem; }
    .tb-aktionen .btn-sek { color: #fff; border-color: rgba(255,255,255,.6); }
    .sub-banner { background: #3d5878; color: #fff; padding: 8px 22px; font-size: .92rem; }
    .klartext-warn { background: var(--warn-bg); color: var(--warn-tinte); padding: 10px 22px; font-size: .9rem; }
    /* A318 Zug 2 — die Zertifikatsmarke am Abschnitt einer angedockten Vorlage.
       DER ZUSTAND STEHT IM TEXT, nicht nur in der Farbe (WCAG 1.4.1): die vier Saetze
       unterscheiden sich woertlich, die Farbe unterstuetzt sie nur. */
    .vorlage-marke {
      display: inline-block; margin: 0 0 8px 0; padding: 4px 10px; border-radius: 4px;
      font-size: .85rem; line-height: 1.4; border: 1px solid transparent;
    }
    .vorlage-marke--gueltig { color: var(--akzent); border-color: var(--akzent); background: var(--flaeche-warm); }
    .vorlage-marke--abgelaufen { color: var(--warn-tinte); background: var(--warn-bg); border-color: var(--warn-tinte); }
    .vorlage-marke--ungueltig { color: var(--fehler); background: var(--fehler-flaeche); border-color: var(--fehler); }
    .vorlage-marke--nicht-pruefbar { color: var(--tinte-weich); background: var(--flaeche-warm); border-color: var(--linie); }
    /* C1 (06.09.2026) — dieselbe Marke wie oben, für ein eingelassenes logikModul statt eine
       Vorlage. Eigene Klasse statt vorlage-marke wiederzuverwenden: die Erhebung
       (tools/zusicherungs-schluessel-erheben.js) leitet ihre Sperrliste aus dem MARKUP ab, nicht
       aus einer Absicht — ein logikModul-Beleg soll dort als eigener Fund erscheinen. */
    .logikmodul-marke {
      display: inline-block; margin: 0 0 8px 0; padding: 4px 10px; border-radius: 4px;
      font-size: .85rem; line-height: 1.4; border: 1px solid transparent;
    }
    .logikmodul-marke--gueltig { color: var(--akzent); border-color: var(--akzent); background: var(--flaeche-warm); }
    .logikmodul-marke--abgelaufen { color: var(--warn-tinte); background: var(--warn-bg); border-color: var(--warn-tinte); }
    .logikmodul-marke--ungueltig { color: var(--fehler); background: var(--fehler-flaeche); border-color: var(--fehler); }
    .logikmodul-marke--nicht-pruefbar { color: var(--tinte-weich); background: var(--flaeche-warm); border-color: var(--linie); }
    /* U2-ADR-258 — die Herkunft der Inhalte. Wie bei der Vorlagen-Marke daneben: DIE AUSSAGE
       STEHT IM TEXT (WCAG 1.4.1), die Farbe wiederholt sie nur. Bewusst KEIN Rot und kein
       Warn-Gelb für den offenen Fall — „nicht geprüft" ist eine Herkunftsangabe, keine Warnung
       (Auflage 4 des Auftrags); die gedämpfte Fläche unterscheidet, ohne zu alarmieren. */
    .herkunft-marke {
      display: block; margin: 0; padding: 9px 22px; font-size: .88rem; line-height: 1.5;
      background: var(--flaeche-warm); color: var(--tinte); border-bottom: 1px solid var(--linie);
    }
    .herkunft-marke--geprueft { border-left: 4px solid var(--akzent); }
    .herkunft-marke--offen { border-left: 4px solid var(--tinte-weich); }
    /* U2-ADR-259 — der Stand. Anders als Herkunft trägt er keine binäre Vertrauens-Unterscheidung
       (geprüft/offen), nur eine Tatsache — bewusst KEINE farbige border-left-Variante, das würde
       eine Wertung erfinden, die der Satz selbst nicht macht (Auflage 5). */
    .stand-marke {
      display: block; margin: 0; padding: 9px 22px; font-size: .88rem; line-height: 1.5;
      background: var(--flaeche-warm); color: var(--tinte); border-bottom: 1px solid var(--linie);
    }
    .shell-body { flex: 1; display: flex; min-height: 0; }
    .shell-einzel { justify-content: center; }
    .sidebar {
      width: 252px; flex-shrink: 0; background: var(--flaeche); border-right: 1px solid var(--linie);
      padding: 14px 10px; overflow-y: auto;
    }
    .nav-item {
      display: block; width: 100%; text-align: left; font: inherit; cursor: pointer;
      background: transparent; border: none; border-radius: 8px; padding: 9px 12px; color: var(--tinte);
    }
    .nav-item:hover { background: var(--flaeche-warm); }
    .nav-item.aktiv { background: var(--flaeche-warm); color: var(--akzent); font-weight: 600; }
    .nav-trenner { font-size: .72rem; text-transform: uppercase; letter-spacing: .6px; color: var(--leer); padding: 16px 12px 6px; }
    /* LA1 (19.09.2026) — steht IN der Sidebar (nicht im Kopfbereich wie herkunft-marke/
       stand-marke), weil er sich auf die NAVIGATION bezieht: einen Bereich, den es dort nicht
       gibt. Gedämpft wie herkunft-marke--offen, keine Warnfarbe (U2-ADR-145: eine Angabe, kein
       Alarm) — DIE AUSSAGE STEHT IM TEXT (WCAG 1.4.1), die Farbe unterstuetzt sie nur. */
    .luecken-hinweis {
      display: block; margin: 0 0 10px 0; padding: 9px 10px; font-size: .82rem; line-height: 1.45;
      background: var(--flaeche-warm); color: var(--tinte); border-radius: 8px; border-left: 3px solid var(--tinte-weich);
    }
    .nav-sit { font-size: .92rem; color: var(--tinte-weich); }
    .content { flex: 1; overflow-y: auto; padding: 28px 34px; }
    .bereich { max-width: 720px; }
    /* U2-ADR-323 — „Rand, nicht Flaeche" (U2-ADR-236), woertlich wie im Kern
       (.content-narrow.marke-fremd): der angedockte Bereich bekommt einen Rand, nicht das ganze
       Depot einen Rahmen. KEIN Text daneben — ein angedockter Bereich soll sein wie ein eigener,
       nicht wie einer mit Beipackzettel (stehende Regel, 06.09.2026). */
    .bereich--angedockt { border-left: 3px solid var(--tinte-weich); padding-left: 16px; }
    .bereich-kopf h2 { margin: 0 0 4px; font-size: 1.4rem; }
    .bereich-intro { color: var(--tinte-weich); margin: 0 0 20px; }
    .sektion { margin-bottom: 26px; }
    .sektion-titel { font-size: .82rem; text-transform: uppercase; letter-spacing: .6px; color: var(--leer); margin: 0 0 8px; }
    .feld-zeile { display: flex; gap: 18px; padding: 8px 0; border-bottom: 1px solid var(--linie); }
    .feld-label { flex: 0 0 200px; color: var(--tinte-weich); }
    .feld-quelle { color: var(--leer); font-size: .85em; }
    .feld-wert { flex: 1; color: var(--tinte); }
    .feld-liste .feld-wert ul { margin: 0; padding-left: 18px; }
    .liste-eintraege li { margin: 2px 0; }
    .feld-urheber { font-size: .8rem; color: var(--leer); padding: 2px 0 6px; font-style: italic; }
    .mappe-thumb { max-width: 160px; max-height: 160px; border-radius: 8px; border: 1px solid var(--linie); }
    .leer-bereich { color: var(--leer); font-style: italic; }

    /* ── Notfall-Sicht ─────────────────────────────────────── */
    .modus-notfall .topbar { background: #a82a1c; }
    .notfall-rahmen { border: 2px solid #a82a1c; border-radius: 14px; padding: 22px 24px; max-width: 560px; }
    .notfall-rahmen .bereich-kopf h2 { color: #a82a1c; }
    .gesperrt { color: var(--tinte-weich); font-size: .9rem; margin: 0 0 8px; }
    .notfall-stand { font-size: .85rem; color: var(--leer); }
    .herkunftsort { margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--linie); color: var(--tinte-weich); font-size: .85rem; }
    .herkunftsort p { margin: 0 0 4px; }
    .hinweis-box { background: var(--flaeche-warm); border: 1px solid var(--linie); border-radius: 10px; padding: 14px 16px; color: var(--tinte-weich); }

    @media (max-width: 720px) {
      .shell-body { flex-direction: column; }
      .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--linie); display: flex; flex-wrap: wrap; gap: 4px; }
      .nav-item { width: auto; }
      .feld-zeile { flex-direction: column; gap: 2px; }
      .feld-label { flex-basis: auto; }
    }
  </style>
</head>

  <div id="app"></div>
  <script>
/* ════════════════════════════════════════════════════════════════════════
   ANMERKUNG SP — kein Code, sondern Hinweis für den Bau (29.05.2026)

   Dies ist die geprüfte Krypto-Kern-Schicht, WÖRTLICH aus VIVODEPOT.html
   (Schema 19) extrahiert. Sie ist NICHT neu zu generieren — sie ist zu
   portieren. Gib sie dem bauenden Modell als fertigen, unveränderlichen
   Block mit und lass es Hülle, Datenmodell, Modus und Design darum herum
   bauen.

   Regeln für das bauende Modell:
   • Diese Funktionen NICHT umschreiben, umbenennen oder "verbessern".
   • Die einzige nach außen gedachte API ist das Objekt VdCrypto am Ende:
       VdCrypto.setupSession(passwort, saltBytes)  -> Promise<void>
       VdCrypto.encryptDepot(obj, key, aad?)       -> Promise<{iv, ct}>
       VdCrypto.decryptDepot(stored, key, aad?)    -> Promise<obj>
   • Verschlüsselungs-Parameter sind in den AAD-Blöcken gebunden — beim
     Entschlüsseln dieselbe AAD übergeben, sonst schlägt GCM fehl (das ist
     gewollt: Manipulations- und Falschpasswort-Erkennung).
   • Klartext wird NIE auf den Stick geschrieben. removePassword() existiert
     nicht und darf nicht entstehen.

   Herkunft (Zeilen in VIVODEPOT.html):
     Konstanten            13610–13616, 14138–14151
     Modul-Zustand         14153, 14164–14165
     deriveMasterBits      14285–14295
     importMasterAesKey    14298–14303
     importMasterHkdfKey   14306–14310
     deriveKey             14218–14226
     deriveKeyLegacy       14229–14238
     encryptData           14240–14250
     decryptData           14252–14259
     deriveSubKey (v1)     14317–14331
     deriveDepotKeyV2      14344–14364
     _deriveHkdfRaw (Test) 14371–14382
     base64-Helfer         14386–14392
     setupMasterSession    14406–14411
     VdCrypto-Surface      14437–14442

   Nicht in diesem Block (kommen mit den jeweiligen Modulen):
     • Angehörigen-Krypto (eigener Salt/IV, Klasse-A-Trennung, ADR-052)
       → gehört zum Übergaben-Modul (ca. Z. 14444 ff.).
     • _verifyJWS (in der VdCrypto-Surface referenziert) → gehört zur
       VC-/Issuer-Schicht. Solange kein VC-Modul andockt, kann der Verweis
       auf verifyJWS in der Surface entfallen oder auf eine Stub-Funktion
       zeigen.
   ════════════════════════════════════════════════════════════════════════ */

/* ════════════════════════════════════════════════════════════════════════
   WAS DIESER BLOCK IST (Nachtrag 18.09.2026, Krypto-Kapselung Weg A)
   ────────────────────────────────────────────────────────────────────────
   Dieser Block wird WORTGLEICH — byte für byte — in seine Träger übernommen.
   Die Kapselung hat daran nichts geändert, nur WAS innerhalb des Blocks
   geschieht (der lebende Sitzungsschlüssel `sessionHkdfKey` ist seither
   closure-privat in `VdCrypto`, nicht mehr ein plain-script-globaler Name).

   EINE Quelle, SECHS Träger — alle byte-identisch zu genau diesem Block:
     vivodepot.html (dieser Block), vivodepot-lesen.html,
     vivodepot-schluessel-teilen.html, vivodepot-template-generator.html,
     vivodepot-vc-issuer.html, und die kanonische Quelle
     vivodepot-krypto-kern-PORT-VERBATIM.js.

   Das hält nicht dieser Kommentar, sondern ein Prüfer:
     node tools/krypto-block-propagation-pruefen.js
   Er vergleicht jeden Träger byte-genau gegen die kanonische Quelle, hält
   eine Mindestzahl (`TRAEGER_MINDESTZAHL`) gegen ein stilles Herausfallen,
   und prüft jede Pin-Stelle (Voll- und Kurz-Hash) im übrigen Repo gegen den

   DIE SCHONFRIST DES KERNS IST HIER NICHT NACHGEBAUT: dort entscheidet der Aufrufer
   (nur für die eingebauten Basis-Vorlagen) über einen Marker. Der Empfänger hat diesen
   Fall nicht — er bekommt fertige Belege und sagt, was er sieht. Ein abgelaufenes
   Zertifikat wird darum als ABGELAUFEN gemeldet und nicht als gültig, und die
   Template-Stufe wird trotzdem gerechnet, damit „abgelaufen" nicht mit „manipuliert"
   zusammenfällt. */
async function verifiziereTemplateKette(certJws, templateJws, opts) {
  let certRes;
  try { certRes = await verifiziereProviderCredential(certJws, opts); }
  catch (e) { return { gueltig: false, grund: 'Cert-Prüf-Fehler: ' + e.message }; }
  const certAblauf = (certRes && certRes.nutzlast
    && (certRes.nutzlast.expirationDate || certRes.nutzlast.validUntil)) || null;
  if (certRes && !certRes.gueltig && certRes.abgelaufen && certRes.nutzlast) {
    const t = await _verifiziereTemplateSignatur(certRes.nutzlast, templateJws, opts);
    return Object.assign({}, t, { gueltig: false, abgelaufen: true, templateOk: !!t.gueltig, certAblauf: certAblauf });
  }
  if (!certRes || !certRes.gueltig) {
    return { gueltig: false, grund: 'Cert ungültig: ' + ((certRes && certRes.grund) || ''),
             abgelaufen: !!(certRes && certRes.abgelaufen) };
  }
  return Object.assign({}, await _verifiziereTemplateSignatur(certRes.nutzlast, templateJws, opts),
    { certAblauf: certAblauf });
}

/* ── Der Prüfstand: welcher Zustand gilt für welches angedockte Feld ───────────────
   VIER ZUSTÄNDE, und der Auftrag nennt den Grund für den vierten: „nicht prüfbar" darf
   weder wie „gültig" noch wie „ungültig" aussehen. Ein Bestandseintrag ohne Beleg ist
   nicht verdächtig — er stammt aus einer Zeit vor Schema 66. Ein manipulierter Beleg
   dagegen ist eine Aussage, und sie muss anders lauten.

     'gueltig'      — Zertifikat und Template-Signatur tragen.
     'abgelaufen'   — Signatur trägt, das Zertifikat ist über seine Gültigkeit hinaus.
     'ungueltig'    — die Signatur trägt NICHT (manipuliert, falscher Anker, kaputt).
     'nicht-pruefbar' — kein Beleg im Depot (Bestandseintrag) oder kein Eintrag zum Feld.

   Rein und ohne UI; wirft nie. Der Rückgabewert ist eine Karte feldId -> Stand, damit
   die Anzeige sie ohne zweite Auflösung lesen kann. */
async function vorlagenPruefstandBerechnen(depot, opts) {
  const karte = Object.create(null);
  const eintraege = (depot && Array.isArray(depot.importierteVorlagen)) ? depot.importierteVorlagen : [];
  for (const v of eintraege) {
    if (!v || typeof v !== 'object') continue;
    const felder = Array.isArray(v.feldIds) ? v.feldIds : [];
    let stand;
    if (!v.beleg || !v.beleg.providerCredentialJws || !v.beleg.templateJws) {
      stand = { zustand: 'nicht-pruefbar', grund: 'kein-beleg', anbieter: v.anbieterName || null };
    } else {
      let r = null;
      try { r = await verifiziereTemplateKette(v.beleg.providerCredentialJws, v.beleg.templateJws, opts); }
      catch (e) { r = { gueltig: false, grund: 'Prüf-Fehler: ' + (e && e.message) }; }
      const anbieter = (r && r.anbieterName) || v.anbieterName || null;
      if (r && r.gueltig) stand = { zustand: 'gueltig', anbieter: anbieter, bis: r.certAblauf || null };
      else if (r && r.abgelaufen && r.templateOk) stand = { zustand: 'abgelaufen', anbieter: anbieter, bis: r.certAblauf || null };
      else stand = { zustand: 'ungueltig', anbieter: anbieter, grund: (r && r.grund) || null };
    }
    for (const fid of felder) karte[fid] = stand;
    if (v.id) karte['vorlage:' + v.id] = stand;
  }
  return karte;
}

/* ── C1 (06.09.2026, "Der Beleg bleibt im Depot") — derselbe Prüfstand für logikModule ──────
   Wörtlicher Nachbau von `vorlagenPruefstandBerechnen` oben, EIN Unterschied: ein logikModul
   ist ein ganzes Dokument, keine Feldgruppe — der Schlüssel der Karte ist darum `m.id`, nicht
   jedes einzelne Feld. Dieselbe Kette (`verifiziereTemplateKette`), unverändert — sie nimmt
   zwei JWS-Strings und einen Zertifikatspfad entgegen, ihr ist gleichgültig, ob die Signatur
   ursprünglich über einer Vorlage oder einem logikModul geleistet wurde.

   DIES IST DER ZWEITE WEG, den U2-ADR-335 verlangt: `modulHerkunftStand` bleibt UNVERÄNDERT
   und sagt weiterhin nie „geprüft" — dieser Prüfstand behauptet nichts aus einem Depot-Feld,
   er PRÜFT eine Signaturkette gegen den eingebetteten Anker. Fällt die Probe „die Lese-App
   sagt HEUTE zu keinem Modul geprüft" (U2-ADR-335 §Konformität) für ein Depot mit gültigem
   Beleg, ist das nach dieser Regel kein Rätsel, sondern das erwartete Ereignis. */
async function logikModulPruefstandBerechnen(depot, opts) {
  const karte = Object.create(null);
  const eintraege = (depot && Array.isArray(depot.logikModule)) ? depot.logikModule : [];
  for (const m of eintraege) {
    if (!m || typeof m !== 'object' || !m.id) continue;
    let stand;
    if (!m.beleg || !m.beleg.providerCredentialJws || !m.beleg.modulSignaturJws) {
      stand = { zustand: 'nicht-pruefbar', grund: 'kein-beleg', anbieter: null };
    } else {
      let r = null;
      try { r = await verifiziereTemplateKette(m.beleg.providerCredentialJws, m.beleg.modulSignaturJws, opts); }
      catch (e) { r = { gueltig: false, grund: 'Prüf-Fehler: ' + (e && e.message) }; }
      const anbieter = (r && r.anbieterName) || null;
      if (r && r.gueltig) stand = { zustand: 'gueltig', anbieter: anbieter, bis: r.certAblauf || null };
      else if (r && r.abgelaufen && r.templateOk) stand = { zustand: 'abgelaufen', anbieter: anbieter, bis: r.certAblauf || null };
      else stand = { zustand: 'ungueltig', anbieter: anbieter, grund: (r && r.grund) || null };
    }
    karte[m.id] = stand;
  }
  return karte;
}

/* ════════════════════════════════════════════════════════════════════════
   QR-EMPFANG (F-3) — Klartext-Notfall + Mehr-Teile-Sammlung
   ──────────────────────────────────────────────────────────────────────── */
// Notfall-QR-Klartext (Bürger-App notfallKernText): „VIVODEPOT NOTFALL\nlabel: wert…"
function parseNotfallQrText(text) {
  if (typeof text !== 'string') return null;
  const zeilen = text.split(/\r?\n/);
  if (!zeilen.length) return null;
  if (zeilen[0].trim() !== STRINGS.notfallQrKopf) return null;
  const out = [];
  for (let i = 1; i < zeilen.length; i++) {
    const z = zeilen[i];
    const idx = z.indexOf(':');
    if (idx < 0) continue;
    const label = z.slice(0, idx).trim();
    const wert = z.slice(idx + 1).trim();
    if (label) out.push({ label, wert });
  }
  return { stand: null, zeilen: out };
}
// Rahmen „VDQR|gid|i/n|nutzlast" (Pipe-Trenner, U2-ADR-082: bewusst proprietär, identisch zur
// Schreib-Seite in vivodepot.html — qrTeilePacken/_qrRahmenParsen). null bei jedem Text, der
// nicht mit „VDQR|" beginnt (z. B. Legacy-Notfall-Klartext, eine vCard, rohes Depot-JSON) —
// der bewährte Passthrough an parseNotfallQrText/JSON.parse in verarbeiteQrText bleibt intakt.
function _qrRahmenParsen(rahmen) {
  const s = String(rahmen == null ? '' : rahmen);
  if (!s.startsWith('VDQR|')) return null;
  const p1 = s.indexOf('|');
  const p2 = s.indexOf('|', p1 + 1);
  const p3 = s.indexOf('|', p2 + 1);
  if (p1 < 0 || p2 < 0 || p3 < 0) return null;
  const gid = s.slice(p1 + 1, p2);
  const mm = s.slice(p2 + 1, p3).match(/^(\d+)\/(\d+)$/);
  if (!mm) return null;
  return { gruppe: gid, index: +mm[1], gesamt: +mm[2], nutzlast: s.slice(p3 + 1) };
}
/* ══ DER QR-ZUSAMMENSETZER, WIEDERAUFGENOMMEN (Kette, Auftrag 8) ═══════════════════════════
   U2-ADR-085 §4 Punkt 3 hat ihn nicht fachlich gestrichen, sondern als TOTEN CODE: „null
   Aufrufer im Produktivcode … streichen ODER BEGRÜNDEN". Die Bedingung ist entfallen — Zug 2
   dieses Auftrags IST der Aufrufer, und die mehrteilige Ausgabe „Teil i von n" ist seit dem
   Produktkonzept vom 19./20.08. Regelfall statt Notlösung. Freigabe: Produktentscheidung vom 20.08.2026. U2-ADR-085 bleibt im Übrigen in Kraft.

   REIN UND ZUSTANDSLOS. Der zustandsbehaftete Sammler `qrTeilAufnehmen` darunter baut darauf
   auf — EIN Mechanismus, nicht zwei nebeneinander. Ein FEHLENDER Teil wird BENANNT statt als
   Teilergebnis ausgegeben; eine stumme Teilausgabe sieht aus wie ein Ergebnis, und genau das
   ist der Fehlschlag, den dieser Zug fangen muss. */
function qrTeileZusammensetzen(rahmenListe) {
  const liste = Array.isArray(rahmenListe) ? rahmenListe : [];
  if (!liste.length) return { fertig: false, grund: 'leer', fehlend: [] };
  let gruppe = null, gesamt = 0;
  const stuecke = new Map();
  for (const r of liste) {
    const p = _qrRahmenParsen(typeof r === 'string' ? r : (r && r.rahmen));
    if (!p) return { fertig: false, grund: 'kein-rahmen', fehlend: [] };
    if (gruppe === null) { gruppe = p.gruppe; gesamt = p.gesamt; }
    else if (p.gruppe !== gruppe || p.gesamt !== gesamt) return { fertig: false, grund: 'fremde-gruppe', fehlend: [] };
    if (p.index < 1 || p.index > gesamt) return { fertig: false, grund: 'index', fehlend: [] };
    stuecke.set(p.index, p.nutzlast);
  }
  const fehlend = [];
  for (let k = 1; k <= gesamt; k++) if (!stuecke.has(k)) fehlend.push(k);
  if (fehlend.length) return { fertig: false, grund: 'unvollstaendig', gruppe, gesamt, empfangen: stuecke.size, fehlend };
  let text = '';
  for (let k = 1; k <= gesamt; k++) text += stuecke.get(k);
  return { fertig: true, grund: null, gruppe, gesamt, empfangen: gesamt, fehlend: [], text };
}
// Sammelt Teile index-verschlüsselt (Map<index,Rahmen>) — beliebige Scan-Reihenfolge.
// Rückgabe: { fertig:true, text } | { fertig:false, i, n, empfangen, fehlend:[…fehlende Indizes] }
// | null (kein VDQR-Rahmen). Setzt über qrTeileZusammensetzen zusammen — EIN Mechanismus.
function qrTeilAufnehmen(text) {
  const p = _qrRahmenParsen(text);
  if (!p) return null;
  if (!qrTeile.has(p.gruppe)) qrTeile.set(p.gruppe, { n: p.gesamt, rahmen: new Map() });
  const slot = qrTeile.get(p.gruppe);
  if (slot.n !== p.gesamt) return null;   // inkonsistente Gruppen-/Gesamtzahl-Angabe
  slot.rahmen.set(p.index, String(text));
  const z = qrTeileZusammensetzen(Array.from(slot.rahmen.values()));
  if (z.fertig) { qrTeile.delete(p.gruppe); return { fertig: true, text: z.text }; }
  return { fertig: false, i: p.index, n: slot.n, empfangen: slot.rahmen.size, fehlend: z.fehlend };
}

/* ════════════════════════════════════════════════════════════════════════
   RENDER — read-only Sichten (keine Bearbeiten-Knöpfe)
   ──────────────────────────────────────────────────────────────────────── */
function el(id) { return document.getElementById(id); }
function setModusFarbe(modus) {
  const farbe = MODUS_FARBE[modus] || MODUS_FARBE.anker;
  document.documentElement.style.setProperty('--akzent', farbe);
  const app = el('app');
  if (app) {
    app.classList.remove('modus-sub', 'modus-notfall');
    if (modus === 'sub') app.classList.add('modus-sub');
    if (modus === 'notfall') app.classList.add('modus-notfall');
  }
}

// Befund 1 („Die Lese-App wird nirgends mitgemessen", 12./13.08.2026): `<header>`
// statt `<div>` — wortgleicher Spiegel des Kerns (vivodepot.html: `<header class="topbar">`).
// Ohne Landmark lag die Topbar auf JEDER Sicht außerhalb von main/nav (axe `region`, 51 Knoten
// über alle 24 gemessenen Sichten). Rein semantisch — `.topbar` bleibt klassenbasiert selektiert,
// kein CSS-Bruch.
/* ══ HILFE FÜR DIE EMPFÄNGERIN (20.09.2026, Auftrag „Hilfe in der Datei") ═══════════
   Eine Empfängerin öffnet eine fremde Datei und hat genau dann vier Fragen: was ist das, was
   kann ich damit tun, wer hat es mir geschickt, was passiert mit meinen Daten. Kurz, kein
   eigenes Themen-Register wie im Kern — vier feste Fragen, `strings:`-Kennungen wie jeder
   andere Bedienfluss-Text dieser Datei (kein neues Register, `_textsatzKennungBekannt` erkennt
   sie schon über `_STRINGS_EINGEBAUT`, kein dritter Weg). Die Antworten liefert die Redaktion.
   VERDRAHTET (20.09.2026, nachdem die Antworten da waren): Knopf `#btn-hilfe` in der Topbar
   (`topbarHTML`/`wireTopbar`) tauscht `#content` gegen `hilfeEmpfaengerinHTML()` — derselbe
   Ersetzungsweg wie ein Sektor-/Situations-Klick in der Sidebar, kein eigenes Overlay nötig. */
const HILFE_LESEN_FRAGEN = Object.freeze(['wasIstDas', 'wasKannIchTun', 'werHatEsGeschickt', 'wasPassiertMitMeinenDaten']);
function hilfeEmpfaengerinModell() {
  return HILFE_LESEN_FRAGEN.map((id) => ({ id, frage: STRINGS['hilfeEmpfaengerinFrage_' + id], antwort: STRINGS['hilfeEmpfaengerinAntwort_' + id] }))
    .filter((f) => f.antwort);
}
/* DER HERKUNFTSORT DER LESE-APP (21.09.2026). Die Urheberin steht hier und nirgends sonst, und sie steht NICHT im Textsatz: Name und
   Lizenzkennung sind Namen, keine Sätze, und gehen darum nicht durch `STRINGS`/`textLesen` — ein Sprachmodul kann sie weder ersetzen noch
   leeren. Nur die zwei Beschriftungen davor sind Texte. Die Stelle liegt außerhalb jeder Marker-Region (BEGIN/END): was ein
   Schnitt aus der Datei herausholt, betrifft sie nicht (tests/lese-app-herkunftsort.test.js schneidet alle Regionen heraus und
   sucht sie danach). Genannt wird die Urheberin, nicht die Anbieterin: die Lese-App hat keine. Der Anker `data-herkunftsort`
   ist derselbe wie im Kern (tests/herkunftsort.test.js). Kein Lizenz-Volltext, nur Nennung und Kennung. */
/* HERKUNFTSORT-ANGABEN:BEGIN — DAUERHAFT, ERZEUGT aus tools/herkunftsort-angaben.json (node tools/herkunftsort-angaben-schreiben.js), in jedem Träger byte-gleich, nicht von Hand ändern */
/* tests/herkunftsort-angaben-gleich.test.js vergleicht. Die Angaben, die am Herkunftsort UNERSETZBAR sind (Spezifikation 34.7): der Name der Urheberin und die
   Lizenzkennung. `schluessel` = die Textsatz-Schlüssel des Herkunftsorts und die Platzhalter, die ihr Text tragen MUSS; `{urheberin}` und `{lizenz}` lösen aus
   DIESER Konstante auf, nie aus dem Branding; `{marke}` ist in diesen Schlüsseln nicht zulässig. DAUERHAFT: Text, den wir führen müssen (tools/geruest-waechter-
   grundlinie.json, regionen.dauerhaft); kein Schnitt nimmt die Urheberin mit. */
const HERKUNFTSORT_ANGABEN = Object.freeze({ urheberin: Object.freeze({ name: 'Vivodepot GmbH', marke: 'Vivodepot', ort: 'Berlin' }), lizenz: 'EUPL-1.2', schluessel: Object.freeze({ herkunftPoweredBy: Object.freeze(['{urheberin}']), herkunftLizenzhinweis: Object.freeze(['{urheberin}', '{lizenz}']) }) });
/* HERKUNFTSORT-ANGABEN:END */

const URHEBER_LESEN = Object.freeze({ name: HERKUNFTSORT_ANGABEN.urheberin.name, ort: HERKUNFTSORT_ANGABEN.urheberin.ort, lizenz: HERKUNFTSORT_ANGABEN.lizenz });
function herkunftsortHTML() {
  return '<div class="herkunftsort" data-herkunftsort="1">' +
    '<p class="herkunft-urheberin">' + escapeHTML(STRINGS.herkunftUrheberin) + ': ' + escapeHTML(URHEBER_LESEN.name + ' · ' + URHEBER_LESEN.ort) + '</p>' +
    '<p class="herkunft-lizenz">' + escapeHTML(STRINGS.herkunftLizenzLabel) + ': ' + escapeHTML(URHEBER_LESEN.lizenz) + '</p>' +
  '</div>';
}
function hilfeEmpfaengerinHTML() {
  const fragen = hilfeEmpfaengerinModell();
  return '<div class="bereich-kopf"><h1>' + escapeHTML(STRINGS.hilfeEmpfaengerinTitel) + '</h1></div>' +
    fragen.map((f) => '<div class="hilfe-frage"><h2>' + escapeHTML(f.frage) + '</h2><p>' + escapeHTML(f.antwort) + '</p></div>').join('') +
    herkunftsortHTML();
}

function topbarHTML(titel, mitSchliessen) {
  return '<header class="topbar">' +
    '<div class="tb-titel">' + escapeHTML(_markeName() + ' · ' + STRINGS.topbarLesen) + '</div>' +

      (mitSchliessen ? '<button class="btn btn-sek" id="btn-schliessen">' + escapeHTML(STRINGS.schliessen) + '</button>' : '') +
    '</div></header>' + sprachfassungHinweisHTML();
}

function subBannerHTML() {
  /* Ein EMPFÄNGER-AUSSCHNITT sagt zuerst, dass er einer ist (U2-ADR-156, 21.08.2026). Ohne
     diesen Satz sähe die Datei aus wie ein sehr leeres Depot, und der Empfänger hielte für
     „alles, was sie hat", was in Wahrheit sein Ausschnitt ist. Die Marke steht IM
     verschlüsselten Teil — ohne Passwort ist sie nicht zu sehen, und das ist richtig so. */
  const marke = data && data.empfaengerAusschnitt;
  if (marke && typeof marke === 'object') {
    // Fund 19.09.2026: hier stand `.identitaet` (die alte Schlüsselform) — der Banner bekam den
    // Namen der Inhaberin nie zu sehen, unabhängig davon, ob einer gesetzt war. Wächter:
    // tests/alte-sektorkennungen-pruefen.test.js.
    const von = identitaetAnzeigename((data.sektoren || {}).identity || {});
    const txt = von ? STRINGS.ausschnittBannerVon.replace('{name}', von) : STRINGS.ausschnittBannerOhneName;
    return '<div class="sub-banner">' + escapeHTML(txt) + '</div>';
  }
  if (leseModus !== 'sub' || !subInfo) return '';
  const inhaber = subInfo.inhaberin || subInfo.bezeichnung || '';
  let txt = STRINGS.subBannerVor + inhaber;
  if (subInfo.verwaltetVon) txt += STRINGS.subBannerVerwaltet + subInfo.verwaltetVon;
  return '<div class="sub-banner">' + escapeHTML(txt) + '</div>';
}

/* ── F-1 Begrüßung + zwei Eingangswege (U2-ADR-085 §5: Kamera-Tür entfernt) ─── */
// Weg 1 (Eingangsschirm, 20.07.2026 — Grundsatz „Wer den Eingangsschirm zeigt,
// räumt vorher auf", analog zur Bürger-App): zentral hier statt bei den Aufrufern — der
// QR-Zurück-Knopf und der generische Hinweis-Helfer (renderHinweisMitZurueck) taten das
// bislang NICHT. Die Lese-App hat kein Vorschau-Konzept zu schützen (anders als die
// Bürger-App): jede vorhandene `data` ist ein bereits entschlüsselter, echter Depot-Auszug,
// daher genügt eine einfache Prüfung ohne Ausnahme.
function renderWelcome() {
  if (data) entladen();
  try { kameraStoppen(); } catch (e) { /* vor der Definition beim ersten Aufruf */ }
  const wrap = el('app');
  setModusFarbe('anker');
  const absaetze = STRINGS.welcomeEinfuehrung.map(p => '<p>' + escapeHTML(p) + '</p>').join('');
  wrap.className = 'welcome-screen';
  wrap.innerHTML =
    // Befund 1: role="main" statt eines echten <main>-Tags — geringster Eingriff, dieselbe
    // Lösung wie an Vorlage-Stellen im Kern (ARIA-Rolle statt Struktur-Umbau). Ohne sie fehlte

    '<div class="welcome" role="main">' +

      '<div class="welcome-text">' + absaetze + '</div>' +
      '<div class="wege">' +
        wegKarteHTML('weg-datei', STRINGS.wegDatei, STRINGS.wegDateiHint) +
        wegKarteHTML('weg-einfuegen', STRINGS.wegEinfuegen, STRINGS.wegEinfuegenHint) +
        wegKarteHTML('weg-kamera', STRINGS.wegKamera, STRINGS.wegKameraHint) +
      '</div>' +

  sprachUmschalterVerdrahten(renderWelcome);
  el('weg-datei').addEventListener('click', () => el('datei-input').click());
  el('datei-input').addEventListener('change', onDateiGewaehlt);

}
function wegKarteHTML(id, titel, hint) {
  return '<button class="weg-karte" id="' + id + '">' +
    '<span class="weg-titel">' + escapeHTML(titel) + '</span>' +
    '<span class="weg-hint">' + escapeHTML(hint) + '</span>' +
  '</button>';
}

/* ── F-2 Datei öffnen ─────────────────────────────────────────────────────── */
function onDateiGewaehlt(ev) {
  const datei = ev && ev.target && ev.target.files && ev.target.files[0];
  if (!datei) return;
  const reader = new FileReader();
  reader.onload = () => {
    let obj;
    try { obj = JSON.parse(magicStrippen(reader.result).json); }
    catch (e) { renderFehler(STRINGS.dateiUnlesbar); return; }
    verarbeiteDatei(obj);
  };
  reader.onerror = () => renderFehler(STRINGS.dateiUnlesbar);
  reader.readAsText(datei);
}

/* DER EINE EINSTIEG für jedes Depot, das in `data` landet (Voll, Sub, Klartext, Klartext-roh, Empfänger-QR): erst die Signaturketten der Sprachmodule
   prüfen (offline, Ergebnis nur im Speicher), dann falten und anmelden. Eine Zuweisung `data = _foldVollmachtenLesen(` außerhalb dieser Funktion
   überspränge die Prüfung — tests/lese-app-depot-einstieg-geprueft.test.js hält das fest. Die Prüfung darf das Öffnen nie brechen. */
async function _depotUebernehmenGeprueft(obj, opts) {
  try { await _textsatzModuleBelegPruefen(obj, opts); } catch (e) { /* ohne Beleg gilt das Modul als unsigniert */ }
  return _foldVollmachtenLesen(obj);
}

function verarbeiteDatei(obj) {
  const format = erkenneFormat(obj);
  if (format === 'voll') {
    // U2-ADR-078: kein passwortloser Notfall-Cache mehr — ein Voll-Depot wird nur mit dem
    // Übergabe-Passwort geöffnet.
    renderPasswort('voll', obj);
  } else if (format === 'blackbox') {
    renderPasswort('sub', obj.umschlag, obj);
  } else if (format === 'klartext') {
    klartextWarnung = true;
    leseModus = 'anker'; subInfo = null;
    _depotUebernehmenGeprueft(obj.depot).then((d) => { data = d; renderVollExport(); }).catch(() => renderFehler(STRINGS.dateiUnlesbar));
  } else if (format === 'klartext-roh') {
    klartextWarnung = true;
    leseModus = 'anker'; subInfo = null;
    _depotUebernehmenGeprueft(obj).then((d) => { data = d; renderVollExport(); }).catch(() => renderFehler(STRINGS.dateiUnlesbar));
  } else if (format === 'qr-pdf') {
    renderQrPdf(obj);
  } else if (format === 'qr-bereich') {
    renderQrBereich(obj);
  } else if (format === 'antwort') {
    renderAntwortOeffnen(obj);
  } else if (format === 'anlass') {
    renderAnlass(obj);
  } else {
    renderFehler(STRINGS.formatUnbekannt);
  }
}

// U2-ADR-082: QR-Selbstauskunft-Sichten — kein Depot-Umschlag, kein Passwort-Gate. Beide
// Nutzlasten sind unverschlüsselte, von der Bürgerin bewusst als QR freigegebene Selbstauskunft
// (PDF-Selbstverifikation bzw. Bereich-Export), im Stil der Notfall-Sicht dargestellt.
function renderQrPdf(obj) {
  const wrap = el('app');
  setModusFarbe('anker');
  wrap.className = 'app-shell modus-notfall';
  const titel = obj.titel || STRINGS.qrPdfTitel;

    '<div class="shell-body shell-einzel"><main class="content"><div class="bereich notfall-rahmen">' +
    '<div class="bereich-kopf"><h1>' + escapeHTML(titel) + '</h1></div>' +
    '<p class="gesperrt">' + escapeHTML(STRINGS.qrSelbstauskunftHinweis) + '</p>';
  // meta.datum (Schreibseite) ist bereits TT.MM.JJJJ formatiert, kein ISO — direkt anzeigen.
  if (obj.stand) html += '<p class="notfall-stand">' + escapeHTML(STRINGS.notfallStand) + ': ' + escapeHTML(String(obj.stand)) + '</p>';
  const bereiche = (Array.isArray(obj.bereiche) ? obj.bereiche : []).filter((b) => b && !b.leer);
  if (!bereiche.length) {

  } else {

        for (const z of (sek.zeilen || [])) {
          html += '<div class="feld-zeile"><div class="feld-label">' + escapeHTML(String(z.label || '')) + '</div>' +
            '<div class="feld-wert">' + escapeHTML(String(z.wert == null ? '' : z.wert)) + '</div></div>';
        }

function renderQrBereich(obj) {
  const wrap = el('app');
  setModusFarbe('anker');
  wrap.className = 'app-shell modus-notfall';
  const titel = obj.bereichLabel || STRINGS.qrBereichTitel;
  let html = topbarHTML(titel, true) +
    '<div class="shell-body shell-einzel"><main class="content"><div class="bereich notfall-rahmen">' +
    '<div class="bereich-kopf"><h1>' + escapeHTML(titel) + '</h1></div>' +
    '<p class="gesperrt">' + escapeHTML(STRINGS.qrSelbstauskunftHinweis) + '</p>';
  // obj.stand traegt einen VOLLEN ISO-Zeitstempel (Schreibseite vivodepot.html: `new Date().toISOString()`,
  // NICHT geschnitten — der frueher hier behauptete `.slice(0,10)` stand dort nie). standKurz liest ihn
  // lokal und zeigt Datum UND Uhrzeit; geschnitten waere er nachts 0–2 Uhr einen Tag alt.
  if (obj.stand) html += '<p class="notfall-stand">' + escapeHTML(STRINGS.notfallStand) + ': ' + escapeHTML(standKurz(obj.stand)) + '</p>';
  const felder = Array.isArray(obj.felder) ? obj.felder : [];
  if (!felder.length) {
    html += '<div class="hinweis-box">' + escapeHTML(STRINGS.notfallLeer) + '</div>';
  } else {
    html += '<div class="sektion">';
    for (const f of felder) {
      html += '<div class="feld-zeile"><div class="feld-label">' + escapeHTML(String(f.label || '')) + '</div>' +
        '<div class="feld-wert">' + escapeHTML(String(f.wert == null ? '' : f.wert)) + '</div></div>';
    }
    html += '</div>';
  }
  html += '</div></main></div>';
  wrap.innerHTML = html;
  wireTopbar();
}

// U2-ADR-078: der passwortlose Notfall-Cache-Knopf ist entfernt — ein zugesandtes Depot wird
// NUR mit dem Übergabe-Passwort geöffnet. Ein alter Umschlag mit `notfallCache`-Klartext-Geschwister
// wird hier NICHT mehr passwortlos angezeigt (das war das Art-9-Leck aus ADR-099/109).
function renderPasswort(art, umschlag, blackboxDatei) {
  const wrap = el('app');
  setModusFarbe(art === 'sub' ? 'sub' : 'anker');
  wrap.className = 'sheet-screen';
  const hint = art === 'sub' ? STRINGS.pwHintSub : STRINGS.pwHintVoll;
  wrap.innerHTML =

     knappste der Lese-App, und jede Zeile darin kostet Aufmerksamkeit in einer Lage, in der
     Aufmerksamkeit knapp ist. Sie steht trotzdem: sie zeigt Depot-Inhalt, und eine Marke, die
     genau in der wichtigsten Sicht fehlt, ist die Lücke, durch die der Fall schlüpft, den sie
     sichtbar machen soll. „Nicht abschaltbar" heißt auch: nicht dort weglassen, wo es unbequem ist. */
  let html = topbarHTML(STRINGS.notfallTitel, true) +
    herkunftBlockHTML(modulHerkunftBerechnen(data)) +
    standBlockHTML(moduleStandBerechnen(data)) +
    '<div class="shell-body shell-einzel"><main class="content"><div class="bereich notfall-rahmen">' +
    '<div class="bereich-kopf"><h1>' + escapeHTML(STRINGS.notfallTitel) + '</h1></div>' +
    '<p class="gesperrt">' + escapeHTML(STRINGS.notfallHinweis) + '</p>' +
    '<p class="bereich-intro">' + escapeHTML(STRINGS.notfallUnterzeile) + '</p>';
  if (cache && cache.stand) html += '<p class="notfall-stand">' + escapeHTML(STRINGS.notfallStand) + ': ' + escapeHTML(standKurz(cache.stand)) + '</p>';
  if (!zeilen.length) {
    html += '<div class="hinweis-box">' + escapeHTML(STRINGS.notfallLeer) + '</div>';
  } else {
    html += '<div class="sektion">';
    for (const z of zeilen) {
      html += '<div class="feld-zeile"><div class="feld-label">' + escapeHTML(String(z.label || '')) + '</div>' +
        '<div class="feld-wert">' + escapeHTML(String(z.wert == null ? '' : z.wert)) + '</div></div>';
    }
    html += '</div>';
  }
  html += '</div></main></div>';
  wrap.innerHTML = html;
  wireTopbar();
}

// Verarbeitet einen QR-Inhalt: Mehr-Teile sammeln, sonst direkt Notfall-Klartext.
// onFund (optional, U2-ADR-082-Nachtrag): feuert GENAU dann, wenn die Sicht gleich wechselt
// (Fund komplett) — explizites Signal für Aufrufer, die währenddessen eine Ressource offen
// halten (z. B. die Kamera), statt das per DOM-Abfrage zu erraten.
function verarbeiteQrText(text, onFortschritt, onFehler, onFund) {
  const teil = qrTeilAufnehmen(text);
  if (teil && !teil.fertig) {
    const msg = STRINGS.qrTeilFortschritt
      .replace('{i}', teil.i).replace(/\{n\}/g, teil.n)
      .replace('{empfangen}', teil.empfangen).replace('{liste}', teil.fehlend.join(', '));
    onFortschritt && onFortschritt(msg);
    return;
  }
  const ganzText = teil && teil.fertig ? teil.text : text;
  const notfall = parseNotfallQrText(ganzText);
  if (notfall && notfall.zeilen.length) {
    onFund && onFund();
    notfallStufe1 = notfall; leseModus = 'notfall'; renderNotfall(); return;
  }
  // evtl. ein eingefügtes JSON (Datei-Inhalt als Text)
  try {
    const obj = JSON.parse(ganzText);
    onFund && onFund();
    verarbeiteDatei(obj); return;
  } catch (e) { /* kein JSON */ }
  onFehler && onFehler(STRINGS.qrUnlesbar);
}

/* ══ DIE ANTWORT ÖFFNEN UND ZEIGEN (Kette, Auftrag 8, Zug 2 und 3) ═════════════════════════
   Zwei Verfahren, EIN Schirm: das Verfahren steht im Umschlag, nicht in der Wahl des

      '</p>' +
      '<p class="hint">' + escapeHTML(perPasswort ? STRINGS.antwortHintPasswort : STRINGS.antwortHintSchluessel) + '</p>' +
      (perPasswort
        ? '<form id="antwort-form" autocomplete="off">' +
            '<input type="password" id="antwort-pw" class="pw-feld" placeholder="' + escapeHTML(STRINGS.antwortPwPlaceholder) + '" autocomplete="off">' +
            '<div class="pw-fehler" id="antwort-fehler" hidden></div>' +

            '<button type="button" class="btn btn-sek" id="btn-zurueck">' + escapeHTML(STRINGS.zurueck) + '</button>' +
          '</div>') +
    '</div>';
  el('btn-zurueck').addEventListener('click', () => { antwortUmschlag = null; renderWelcome(); });
  const fehler = (text) => { const f = el('antwort-fehler'); f.textContent = text; f.hidden = false; };
  if (perPasswort) {
    el('antwort-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pw = el('antwort-pw').value;
      try {
        const ds = await antwortEntschluesselnPasswort(umschlag, pw);
        el('antwort-pw').value = '';
        renderAntwort(ds, umschlag);
      } catch (err) { el('antwort-pw').value = ''; fehler(STRINGS.antwortFalsch); el('antwort-pw').focus(); }
    });
    const pf = el('antwort-pw'); if (pf && pf.focus) pf.focus();
  } else {
    el('antwort-key').addEventListener('change', (ev) => {
      const datei = ev && ev.target && ev.target.files && ev.target.files[0];
      if (!datei) return;
      const reader = new FileReader();
      reader.onload = async () => {
        let jwk;

        try { renderAntwort(await antwortEntschluesselnSchluessel(umschlag, jwk), umschlag); }

    });

/* Das Blatt. Es zeigt GENAU, was `antwortAnzeigeModell` hergibt — nicht mehr (es gibt kein
   Depot dahinter) und nicht weniger (die Aussagen über die Teilantwort sind das Wertvollste
   daran). Weitergeben als Datensatz: der Klartext, den die Bürgerin herausgegeben hat, als
   Datei — für die Fachanwendung der Institution. */
let antwortDatensatz = null;
function renderAntwort(datensatz, umschlag) {
  antwortDatensatz = datensatz;

    '<p id="antwort-zweck"><strong>' + escapeHTML(STRINGS.antwortZweck) + '</strong> ' + escapeHTML(m.zweck || '—') + '</p>' +
    '<p id="antwort-grundlage"><strong>' + escapeHTML(STRINGS.antwortGrundlage) + '</strong> ' + escapeHTML(m.grundlage || '—') + '</p>';
  /* U2-ADR-258 — VOR der Feldliste, nicht danach: der Empfänger soll wissen, woraus die
     folgenden Angaben stammen, bevor er sie liest. Unbedingt, ohne Schalter — auch (und gerade)

  h += herkunftBlockHTML(m.modulHerkunft);

  if (!m.vollstaendig) {

  }

  el('btn-antwort-weiter').addEventListener('click', () => antwortWeitergeben());

/* Der Klartext-Datensatz. Trägt er eine Anfrage, ist er eine gesicherte Antwort und bekommt
   dasselbe Blatt wie die geöffnete Antwort. Sonst ein Anlass oder eine Zusammenstellung: dasselbe
   Anzeigemodell, ohne die Anfrage-Zeilen, dafür mit dem Titel des Anlasses und der Angabe, WER den
   Datensatz herausgegeben hat — eine Vertretung wird genannt, nicht verschwiegen. */
function anlassAnzeigeModell(datensatz) {
  const ds = (datensatz && typeof datensatz === 'object') ? datensatz : {};
  const m = antwortAnzeigeModell(ds, null);
  const v = (ds.vertretung && typeof ds.vertretung === 'object') ? ds.vertretung : null;
  return Object.assign(m, {
    titel: String((ds.anlass && ds.anlass.titel) || STRINGS.anlassTitelOhneName),
    vertretung: v ? { handelnd: String(v.handelnd || ''), fuer: String(v.fuer || ''), grundlage: String(v.eigenschaftText || '') } : null,
  });
}
function renderAnlass(datensatz) {
  if (datensatz && datensatz.anfrage && typeof datensatz.anfrage === 'object') { antwortUmschlag = null; renderAntwort(datensatz, null); return; }

  if (m.vertretung) {

      .replace('{handelnd}', m.vertretung.handelnd || '—').replace('{fuer}', m.vertretung.fuer || '—')) + '</strong>' +
      (m.vertretung.grundlage ? ' ' + escapeHTML(STRINGS.anlassVertretungGrundlage.replace('{grundlage}', m.vertretung.grundlage)) : '') + '</p>';
  } else {
    h += '<p id="anlass-vertretung">' + escapeHTML(STRINGS.anlassOhneVertretung) + '</p>';
  }
  h += herkunftBlockHTML(m.modulHerkunft);
  h += standBlockHTML(m.moduleStand);
  h += '<ul class="antwort-felder" id="anlass-felder">';
  for (const f of m.felder) {
    h += '<li data-anlass-feld="' + escapeHTML(f.label) + '"><strong>' + escapeHTML(f.label) + ':</strong> ' + escapeHTML(f.wert) +
      (f.gueltigBis ? ' <span class="weg-hint">' + escapeHTML(STRINGS.antwortGueltigBis + ' ' + String(f.gueltigBis).slice(0, 10)) + '</span>' : '') +
      '</li>';
  }
  h += '</ul>';
  if (m.fehlend.length) {
    h += '<p id="anlass-fehlend"><strong>' + escapeHTML(STRINGS.antwortFehlend) + '</strong> ' +
      escapeHTML(m.fehlend.map((f) => f.label).join(', ')) + '</p>';
  }
  if (m.unbekannt.length) {
    h += '<p id="anlass-unbekannt"><strong>' + escapeHTML(STRINGS.antwortUnbekannt) + '</strong> ' + escapeHTML(m.unbekannt.join(', ')) + '</p>';
  }
  if (m.zurueckgehalten) {
    h += '<p id="anlass-zurueckgehalten">' + escapeHTML(STRINGS.antwortZurueckgehalten.replace('{n}', String(m.zurueckgehalten))) + '</p>';
  }
  h += '<div class="sheet-aktionen">' +
    '<button type="button" class="btn btn-sek" id="btn-zurueck">' + escapeHTML(STRINGS.zurueck) + '</button>' +
    '</div></div>';
  wrap.innerHTML = h;
  el('btn-zurueck').addEventListener('click', () => renderWelcome());
}
/* WEITERGEBEN als Datensatz — die Fachanwendung der Institution liest JSON, keinen Bildschirm.
   Kein Netz, kein Upload: eine Datei, die der Mensch selbst weiterreicht. */
function antwortWeitergeben() {
  if (!antwortDatensatz || typeof Blob !== 'function') return;
  const name = 'Vivodepot_Antwort_Klartext_'
    + String((antwortUmschlag && antwortUmschlag.vorgang) || 'Vorgang').replace(/[^\p{L}\p{N}_-]+/gu, '-') + '.json';
  const blob = new Blob([JSON.stringify(antwortDatensatz, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ══ DER KAMERA-PFAD, WIEDERAUFGENOMMEN (Kette, Auftrag 8 — U2-ADR-085 §5 Entscheidung 3) ══
   Er wurde am 14.07.2026 entfernt, weil seine einzige Begründung (zwei QR-Nutzlastformen)
   entfallen war — „toter Code MIT GERÄTE-BERECHTIGUNG, eine eigene Klasse". Er kommt mit
   diesem Auftrag zurück, und der Grund ist eine Auflage, keine Bequemlichkeit: die
   Geräte-Probe verlangt, dass ein QR mit einer GEWÖHNLICHEN Handykamera gelesen wird — am
   Bildschirm, auf Papier, bei Tageslicht. Was am Rechner grün ist und am Tresen nicht
   funktioniert, ist nicht fertig.

   DREI GRENZEN, damit die Geräte-Berechtigung nicht mehr kostet, als sie trägt:
     · Die Kamera wird NUR auf ausdrücklichen Klick geöffnet, nie beim Laden der Seite.
     · Sie wird beim ersten vollständigen Fund und bei jedem Verlassen SOFORT geschlossen —
       eine Kamera, die weiterläuft, ist ein offenes Mikroskop auf dem Schreibtisch.
     · Fehlt der Browser-Leser (`BarcodeDetector`) oder verweigert der Mensch den Zugriff,
       wird das GESAGT und der Einfüge-Weg bleibt — kein Nachladen aus dem Netz, nie. */
let kameraStrom = null;
let kameraLaeuft = false;
function kameraStoppen() {
  kameraLaeuft = false;
  try { if (kameraStrom) kameraStrom.getTracks().forEach((t) => t.stop()); } catch (e) { /* egal */ }
  kameraStrom = null;
}
function kameraMoeglich() {
  return !!(typeof navigator !== 'undefined' && navigator.mediaDevices
    && typeof navigator.mediaDevices.getUserMedia === 'function');
}
function kameraLeserMoeglich() { return typeof BarcodeDetector !== 'undefined'; }
function renderKamera() {
  const wrap = el('app');
  setModusFarbe('anker');
  wrap.className = 'sheet-screen';
  wrap.innerHTML =
    '<div class="sheet" role="main">' +
      '<h1>' + escapeHTML(STRINGS.kameraTitel) + '</h1>' +
      '<p class="hint" id="kamera-hint">' + escapeHTML(STRINGS.kameraSucht) + '</p>' +
      '<video id="kamera-video" playsinline muted style="width:100%;max-width:480px;border-radius:8px"></video>' +
      '<div class="pw-fehler" id="kamera-fehler" hidden></div>' +
      '<div id="kamera-fortschritt" class="qr-fortschritt" hidden></div>' +
      '<div class="sheet-aktionen">' +
        '<button type="button" class="btn btn-sek" id="btn-zurueck">' + escapeHTML(STRINGS.zurueck) + '</button>' +
        '<button type="button" class="btn" id="btn-kamera-start">' + escapeHTML(STRINGS.kameraStarten) + '</button>' +
      '</div>' +
    '</div>';
  el('btn-zurueck').addEventListener('click', () => { kameraStoppen(); qrTeile.clear(); renderWelcome(); });
  const fehler = (t) => { const f = el('kamera-fehler'); f.textContent = t; f.hidden = false; };
  el('btn-kamera-start').addEventListener('click', async () => {
    if (!kameraMoeglich()) { fehler(STRINGS.kameraFehlt); return; }
    if (!kameraLeserMoeglich()) { fehler(STRINGS.kameraKeinLeser); return; }
    let strom;
    try { strom = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }); }
    catch (e) { fehler(STRINGS.kameraAbgelehnt); return; }
    kameraStrom = strom; kameraLaeuft = true;
    const video = el('kamera-video');
    video.srcObject = strom;
    try { await video.play(); } catch (e) { /* Autoplay-Politik — der Rahmen bleibt trotzdem stehen */ }
    const leser = new BarcodeDetector({ formats: ['qr_code'] });
    const schleife = async () => {
      if (!kameraLaeuft) return;
      try {
        const treffer = await leser.detect(video);
        for (const t of treffer) {
          verarbeiteQrText(String(t.rawValue || ''),
            (msg) => { const f = el('kamera-fortschritt'); if (f) { f.textContent = msg; f.hidden = false; } },
            (msg) => fehler(msg),
            () => kameraStoppen());          // Fund komplett → Kamera SOFORT zu
          if (!kameraLaeuft) return;
        }
      } catch (e) { /* ein einzelner Bildfehler beendet den Scan nicht */ }
      if (kameraLaeuft) setTimeout(schleife, 250);
    };
    schleife();
  });
}

  el('btn-neu').addEventListener('click', renderWelcome);
}

// F-6 — alles aus dem RAM entladen. Es gibt nichts zu persistieren (kein Storage),
// daher genügt das Nullen der Modul-Referenzen; GC räumt den Rest.
function entladen() {
  data = null;
  _markeAnzeigeAnwenden();   // Tab-Titel sofort zurück auf nativ — kein Marken-Leck übers Schliessen hinaus
  _markeFarbeAnwenden();     // dasselbe für die Topbar-Farbe — sonst bliebe sie am nächsten Depot hängen
  _markePaletteAnwenden();   // und dasselbe für die fünf Palette-Tokens
  /* Glied 8: die angedockten Register gehen MIT dem Depot. Ein Satz, der nach dem Schliessen
     stehen bliebe, spräche auf der Startseite weiter — und beim nächsten Depot bis zum ersten
     Öffnen. Die Anmeldung ist an das offene Depot gebunden, nicht an die Sitzung. */
  _TEXTSATZ_MODUL_REGISTRY = Object.create(null);
  _TEXTSATZ_MODUL_SPRACHE = null;
  _RECHTSRAUM_MODUL_REGISTRY = Object.create(null);
  /* A318 Zug 2: derselbe Grund wie eine Zeile darüber — ein Prüfstand, der nach dem
     Schliessen stehen bliebe, markierte die Felder des NÄCHSTEN Depots mit dem Urteil
     über das vorige. */
  vorlagenStandZuruecksetzen();
  logikModulStandZuruecksetzen();   // C1 (06.09.2026): derselbe Grund — kein Urteil übers vorige Depot
  leseModus = 'anker';
  subInfo = null;
  klartextWarnung = false;
  notfallStufe1 = null;
  qrTeile.clear();
  aktiverSektorId = null;
  // Sitzungsschlüssel des VdCrypto-Blocks beenden (Krypto-Kapselung Weg A, 18.09.2026) —
  // vorher ein "best effort"-Nullen eines Globals, das seit der Kapselung nicht mehr
  // erreichbar ist und darum lautlos zu einem Nichts-Tun geworden wäre.
  VdCrypto.sitzungBeenden();
}

/* ── QR-Übergabe empfangen (b16-Wiedereinbau, Krisenvorsorge-Auftrag 24.08.2026, Zug 3c) ──
   Gegenstück zu `empfaengerQrPayloadBauen`/`empfaengerQrHerausgeben` im Kern. Kein neuer
   Renderer: nach dem Entschlüsseln läuft derselbe Pfad wie eine geöffnete Empfänger-Datei
   (`leseModus = 'sub'`, `renderVollExport()`) — der Zuschnitt hat exakt dieselbe Form. */
const EMPFAENGER_QR_HASH_PRAEFIX = 'eqr=';

async function _empfaengerQrDeriveKey(passwort, saltBytes) {
  const basis = await crypto.subtle.importKey('raw', new TextEncoder().encode(String(passwort)),
    { name: 'PBKDF2' }, false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: saltBytes, iterations: PBKDF2_ITERATIONS, hash: 'SHA-256' },
    basis, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
}

function _empfaengerQrHashLesen() {
  const roh = (typeof location !== 'undefined' && location.hash) ? location.hash.slice(1) : '';
  if (!roh.startsWith(EMPFAENGER_QR_HASH_PRAEFIX)) return null;
  return roh.slice(EMPFAENGER_QR_HASH_PRAEFIX.length);
}

async function _empfaengerQrEntschluesseln(payloadB64, passwort) {
  const json = atob(payloadB64.replace(/-/g, '+').replace(/_/g, '/'));
  const umschlag = JSON.parse(json);
  const salt = base64ToBytes(umschlag.s);
  const iv = base64ToBytes(umschlag.i);
  const ct = base64ToBytes(umschlag.c);
  const key = await _empfaengerQrDeriveKey(passwort, salt);
  const klartext = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
  return JSON.parse(new TextDecoder().decode(klartext));
}

function renderEmpfaengerQrPasswort(payloadB64) {
  const wrap = el('app');
  setModusFarbe('sub');
  wrap.className = 'sheet-screen';
  wrap.innerHTML =
    '<div class="sheet" role="main">' +
      sprachUmschalterHTML() +
      '<h1>' + escapeHTML(STRINGS.pwTitel) + '</h1>' +
      '<p class="hint">' + escapeHTML(STRINGS.kreiseQrEmpfangHint) + '</p>' +
      '<form id="pw-form" autocomplete="off">' +
        '<input type="password" id="pw-feld" class="pw-feld" placeholder="' + escapeHTML(STRINGS.pwPlaceholder) + '" autocomplete="off">' +
        '<div class="pw-fehler" id="pw-fehler" hidden></div>' +
        '<div class="sheet-aktionen">' +
          '<button type="button" class="btn btn-sek" id="btn-zurueck">' + escapeHTML(STRINGS.zurueck) + '</button>' +
          '<button type="submit" class="btn">' + escapeHTML(STRINGS.pwOeffnen) + '</button>' +
        '</div>' +
      '</form>' +
    '</div>';
  el('btn-zurueck').addEventListener('click', () => {
    if (typeof history !== 'undefined' && history.replaceState) history.replaceState(null, '', location.pathname + location.search);
    renderWelcome();
  });
  sprachUmschalterVerdrahten(() => renderEmpfaengerQrPasswort(payloadB64));
  const form = el('pw-form');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw = el('pw-feld').value;       // nie loggen, nie in URL
    const f = el('pw-fehler');
    try {
      const nutzlast = await _empfaengerQrEntschluesseln(payloadB64, pw);
      if (typeof nutzlast.ablauf === 'number' && Date.now() > nutzlast.ablauf) {
        f.textContent = STRINGS.kreiseQrAbgelaufen; f.hidden = false; el('pw-feld').value = '';
        return;
      }
      el('pw-feld').value = '';
      data = await _depotUebernehmenGeprueft(nutzlast.inhalt);
      leseModus = 'sub';
      subInfo = { inhaberin: '', bezeichnung: nutzlast.kreis || '' };
      renderVollExport();
    } catch (err) {
      f.textContent = STRINGS.pwFalsch;
      f.hidden = false;
      el('pw-feld').value = '';
      el('pw-feld').focus();
    }
  });
  const pf = el('pw-feld'); if (pf && pf.focus) pf.focus();
}

/* ── Boot ─────────────────────────────────────────────────────────────────── */
function boot() {
  // Defensive: niemals persistente Speicher anfassen. (Es gibt im Code keinen Zugriff;
  // dieser Block dokumentiert die Invariante und ist ein no-op.)
  const qrPayload = _empfaengerQrHashLesen();
  if (qrPayload) { renderEmpfaengerQrPasswort(qrPayload); return; }
  renderWelcome();
}
if (typeof document !== 'undefined' && document.addEventListener) {
  document.addEventListener('DOMContentLoaded', boot);
}
